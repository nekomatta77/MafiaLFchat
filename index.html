<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia: Night Fury Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-main: #c5c6c7;
            --neon-blue: #45a29e;
            --neon-purple: #8a2be2;
            --blood-red: #c90000;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            background: linear-gradient(90deg, #0b0c10 0%, #1a1a2e 50%, #0b0c10 100%);
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
            position: relative;
        }
        h1 { margin: 0; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--neon-blue); }
        .status-bar {
            font-size: 14px;
            color: var(--neon-blue);
            margin-top: 5px;
            font-weight: bold;
        }
        .btn-role {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: 1px solid var(--neon-purple);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background-color: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
            border-left: 3px solid var(--neon-blue);
        }
        .message.self {
            align-self: flex-end;
            background-color: #2b2b40;
            border-left: none;
            border-right: 3px solid var(--neon-purple);
        }
        .message span.author {
            font-size: 12px;
            color: var(--neon-blue);
            display: block;
            margin-bottom: 3px;
        }
        .message.self span.author { color: var(--neon-purple); }

        #input-area {
            display: flex;
            padding: 15px;
            background-color: var(--panel-bg);
            border-top: 1px solid #333;
        }
        input[type="text"] {
            flex: 1;
            background: #0b0c10;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 12px;
            border-radius: 20px;
            outline: none;
        }
        input:disabled {
            border-color: #555;
            background: #111;
        }
        button.send-btn {
            background: transparent;
            border: 2px solid var(--neon-purple);
            color: white;
            margin-left: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        button.send-btn:disabled {
            border-color: #555;
            color: #555;
        }

        /* Модальное окно с описанием роли */
        #role-modal {
            display: none;
            position: absolute;
            top: 20%;
            left: 10%;
            width: 80%;
            background: #1a1a2e;
            border: 2px solid var(--neon-purple);
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.7);
            z-index: 100;
            text-align: center;
        }
        #role-modal h2 { margin-top: 0; color: var(--neon-blue); }
        .close-modal {
            background: var(--neon-purple);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="room-title">🐉 Комната Мафии</h1>
        <div class="status-bar" id="phase-status">Ожидание игроков...</div>
        <button class="btn-role" onclick="toggleRoleModal()">Моя Роль</button>
    </header>

    <div id="role-modal">
        <h2 id="role-name">Загрузка...</h2>
        <p id="role-desc">Ожидайте раздачу ролей.</p>
        <button class="close-modal" onclick="toggleRoleModal()">Понятно</button>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Написать в чат..." autocomplete="off">
        <button class="send-btn" id="send-btn" onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        const user = tg.initDataUnsafe?.user || { first_name: "Дракон_" + Math.floor(Math.random() * 100) };
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'test';
        
        let currentPhase = "Ожидание";
        let phaseTimeLeft = 0;
        let timerInterval = null;
        let isDead = false;

        const wsUrl = `wss://599c4d87e8fafa.lhr.life/ws/mafia/${roomId}`;
        const ws = new WebSocket(wsUrl);

        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const phaseStatus = document.getElementById('phase-status');

        ws.onopen = () => {
            ws.send(JSON.stringify({ name: user.first_name }));
        };

        ws.onmessage = (event) => {
            const parsed = JSON.parse(event.data);
            
            if (parsed.event === "system") {
                addSystemMessage(parsed.message);
            } 
            else if (parsed.event === "update" && parsed.data.action === "chat") {
                const isSelf = parsed.data.sender === user.first_name;
                addChatMessage(parsed.data.sender, parsed.data.text, isSelf);
            }
            else if (parsed.event === "role_assigned") {
                document.getElementById('role-name').innerText = parsed.role;
                document.getElementById('role-desc').innerText = parsed.description;
                toggleRoleModal(); 
            }
            else if (parsed.event === "phase_changed") {
                currentPhase = parsed.phase;
                phaseTimeLeft = parsed.duration;
                startTimer();
                addSystemMessage(`🌙 Фаза сменилась на: ${currentPhase}`);
            }
            else if (parsed.event === "you_died") {
                isDead = true;
                input.disabled = true;
                sendBtn.disabled = true;
                input.placeholder = "Вы мертвы...";
                document.body.style.border = "4px solid var(--blood-red)";
            }
        };

        function startTimer() {
            clearInterval(timerInterval);
            updatePhaseUI();
            timerInterval = setInterval(() => {
                phaseTimeLeft--;
                if (phaseTimeLeft <= 0) clearInterval(timerInterval);
                updatePhaseUI();
            }, 1000);
        }

        function updatePhaseUI() {
            phaseStatus.innerText = `${currentPhase} (Осталось: ${phaseTimeLeft} сек)`;
        }

        function toggleRoleModal() {
            const modal = document.getElementById('role-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function sendMessage() {
            if (isDead) return;
            const text = input.value.trim();
            if (text && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "chat",
                    sender: user.first_name,
                    text: text
                }));
                input.value = '';
            }
        }

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        function addChatMessage(author, text, isSelf) {
            const div = document.createElement('div');
            div.className = `message ${isSelf ? 'self' : ''}`;
            div.innerHTML = `<span class="author">${author}</span>${text}`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = "center";
            div.style.color = "var(--neon-purple)";
            div.style.fontSize = "12px";
            div.style.margin = "10px 0";
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
